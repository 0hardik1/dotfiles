# ===============================================
# 🎨 MODERN ALACRITTY CONFIGURATION
# ===============================================

[general]
live_config_reload = true

[terminal]
[terminal.shell]
program = "/opt/homebrew/bin/zsh"

# ===============================================
# 🔤 FONT CONFIGURATION
# ===============================================

[font]
normal = { family = "JetBrains Mono Nerd Font", style = "Regular" }
bold = { family = "JetBrains Mono Nerd Font", style = "Bold" }
italic = { family = "JetBrains Mono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrains Mono Nerd Font", style = "Bold Italic" }
size = 14.0
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 0 }

# ===============================================
# 🌈 TOKYO NIGHT COLOR SCHEME
# ===============================================

[colors.primary]
background = '#1a1b26'
foreground = '#c0caf5'

[colors.normal]
black   = '#15161e'
red     = '#f7768e'
green   = '#9ece6a'
yellow  = '#e0af68'
blue    = '#7aa2f7'
magenta = '#bb9af7'
cyan    = '#7dcfff'
white   = '#a9b1d6'

[colors.bright]
black   = '#414868'
red     = '#f7768e'
green   = '#9ece6a'
yellow  = '#e0af68'
blue    = '#7aa2f7'
magenta = '#bb9af7'
cyan    = '#7dcfff'
white   = '#c0caf5'

[colors.indexed_colors]
[[colors.indexed_colors]]
index = 16
color = '#ff9e64'

[[colors.indexed_colors]]
index = 17
color = '#db4b4b'

# ===============================================
# 🪟 WINDOW CONFIGURATION
# ===============================================

[window]
opacity = 0.95
blur = true
decorations = "buttonless"
startup_mode = "Windowed"
dynamic_title = true
dynamic_padding = false

[window.dimensions]
columns = 120
lines = 40

[window.padding]
x = 10
y = 10

# ===============================================
# 📜 SCROLLING CONFIGURATION
# ===============================================

[scrolling]
history = 10000
multiplier = 3

# ===============================================
# 🖱️ MOUSE CONFIGURATION
# ===============================================

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

# ===============================================
# ⌨️ KEYBOARD BINDINGS
# ===============================================

[keyboard]
bindings = [
  # Clipboard
  { key = "V", mods = "Command", action = "Paste" },
  { key = "C", mods = "Command", action = "Copy" },
  
  # Navigation
  { key = "Up", mods = "Alt", chars = "\u001b[1;5A" },
  { key = "Down", mods = "Alt", chars = "\u001b[1;5B" },
  { key = "Left", mods = "Alt", chars = "\u001bb" },
  { key = "Right", mods = "Alt", chars = "\u001bf" },
  
  # Home/End
  { key = "Left", mods = "Command", chars = "\u001bOH", mode = "AppCursor" },
  { key = "Right", mods = "Command", chars = "\u001bOF", mode = "AppCursor" },
  
  # New window/tab
  { key = "T", mods = "Command", action = "CreateNewWindow" },
  { key = "W", mods = "Command", action = "Quit" },
  
  # Font size
  { key = "Plus", mods = "Command", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Command", action = "DecreaseFontSize" },
  { key = "Key0", mods = "Command", action = "ResetFontSize" },
  
  # Search
  { key = "F", mods = "Command", action = "SearchForward" },
  
  # Clear screen
  { key = "K", mods = "Command", chars = "\u000c" },
]

# ===============================================
# 🔍 SEARCH CONFIGURATION
# ===============================================

[search]
[search.matches]
foreground = '#1a1b26'
background = '#e0af68'

[search.focused_match]
foreground = '#1a1b26'
background = '#f7768e'

# ===============================================
# 🎯 CURSOR CONFIGURATION
# ===============================================

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
unfocused_hollow = true

# ===============================================
# 🔔 BELL CONFIGURATION
# ===============================================

[bell]
animation = "EaseOutExpo"
duration = 0
color = '#f7768e'